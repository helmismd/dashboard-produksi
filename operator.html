    <!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pengukuran Silo - Operator</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 15px; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border: 1px solid #ddd; }
        h2 { text-align: center; color: #007bff; margin-top: 0; font-size: 22px; border-bottom: 2px solid #007bff; padding-bottom: 10px; }
                /* ❌ CARI KODE INI DAN GANTI URUTANNYA AGAR PAS DI SEMUA LAYAR: */
        .row { 
            display: flex; 
            gap: 8px; /* Mengurangi jarak antar kotak dari 10px menjadi 8px */
            margin-bottom: 15px; 
        }
        .group { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            min-width: 0; /* Mencegah kotak memaksa keluar dari pembungkus */
        }
        input { 
            padding: 12px 5px; /* Mengurangi padding kanan-kiri agar teks angka muat */
            border: 2px solid #ccc; 
            border-radius: 8px; 
            font-size: 15px; /* Sedikit mengecilkan huruf agar muat di layar padat */
            outline: none; 
            transition: 0.3s; 
            text-align: center; 
            background-color: #fff; 
            width: 100%; /* Memaksa kotak mengikuti lebar grupnya */
            box-sizing: border-box; /* Memastikan padding tidak membuat kotak melebar */
        }

    </style>
</head>
<body>

<div class="container">
    <h2>INPUT UKUR SILO</h2>
    
    <div class="row">
        <div class="group">
            <label>Hari</label>
            <input type="text" id="opHari" placeholder="Sabtu">
        </div>
        <div class="group">
            <label>Tanggal</label>
            <input type="text" id="opTgl" placeholder="01-Agt-26">
        </div>
    </div>

    <!-- BLOK SILO 1 -->
    <div class="section-title">SILO 1 (OPC) - METER MURNI</div>
    <div class="row">
        <div class="group"><label>Lubang 1</label><input type="number" step="0.01" id="opS1_L1" placeholder="0.00"></div>
        <div class="group"><label>Lubang 2</label><input type="number" step="0.01" id="opS1_L2" placeholder="0.00"></div>
        <div class="group"><label>Lubang 3</label><input type="number" step="0.01" id="opS1_L3" placeholder="0.00"></div>
    </div>

    <!-- BLOK SILO 2 -->
    <div class="section-title">SILO 2 (PCC) - METER MURNI</div>
    <div class="row">
        <div class="group"><label>Lubang 1</label><input type="number" step="0.01" id="opS2_L1" placeholder="0.00"></div>
        <div class="group"><label>Lubang 2</label><input type="number" step="0.01" id="opS2_L2" placeholder="0.00"></div>
        <div class="group"><label>Lubang 3</label><input type="number" step="0.01" id="opS2_L3" placeholder="0.00"></div>
    </div>

    <button onclick="kirimDataSilo()">KIRIM DATA SILO</button>
</div>

<script>
    // Pengisian hari & tanggal otomatis di HP Operator saat halaman dibuka
    window.onload = function() {
        const hariIndo = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
        const bulanIndo = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agt", "Sep", "Okt", "Nov", "Des"];
        const skrg = new Date();
        
        document.getElementById("opHari").value = hariIndo[skrg.getDay()];
        
        const tgl = String(skrg.getDate()).padStart(2, '0');
        const bln = bulanIndo[skrg.getMonth()];
        const thn = String(skrg.getFullYear()).substring(2); 
        document.getElementById("opTgl").value = `${tgl}-${bln}-${thn}`;
    };

    // Fungsi pengirim data terintegrasi penuh ke GitHub data.json Anda
    async function kirimDataSilo() {
        const token = localStorage.getItem("github_token"); 
        
        if (!token) {
            const inputToken = prompt("Silakan masukkan Token GitHub Terlebih Dahulu:");
            if (inputToken) {
                localStorage.setItem("github_token", inputToken.trim());
                alert("Token Berhasil Disimpan! Silakan klik tombol Kirim kembali.");
            }
            return;
        }

        const s1_l1 = parseFloat(document.getElementById("opS1_L1").value) || 0;
        const s1_l2 = parseFloat(document.getElementById("opS1_L2").value) || 0;
        const s1_l3 = parseFloat(document.getElementById("opS1_L3").value) || 0;

        const s2_l1 = parseFloat(document.getElementById("opS2_L1").value) || 0;
        const s2_l2 = parseFloat(document.getElementById("opS2_L2").value) || 0;
        const s2_l3 = parseFloat(document.getElementById("opS2_L3").value) || 0;

        if (s1_l1 === 0 && s2_l1 === 0) {
            alert("Mohon isi angka pengukuran lubang silo terlebih dahulu!");
            return;
        }

        // 📝 EKSEKUSI RUMUS PENGURANG EXCEL ASLI ANDA
        const s1_fix_L1 = s1_l1 > 0 ? (s1_l1 - 1) : 0;
        const s1_fix_L2 = s1_l2 > 0 ? (s1_l2 - 0.8) : 0;
        const s1_fix_L3 = s1_l3 > 0 ? (s1_l3 - 0.8) : 0;

        const s2_fix_L1 = s2_l1 > 0 ? (s2_l1 - 1) : 0;
        const s2_fix_L2 = s2_l2 > 0 ? (s2_l2 - 1.2) : 0;
        const s2_fix_L3 = s2_l3 > 0 ? (s2_l3 - 0.8) : 0;

        const totalSilo1 = s1_fix_L1 + s1_fix_L2 + s1_fix_L3;
        const rataSilo1  = totalSilo1 / 3;

        const totalSilo2 = s2_fix_L1 + s2_fix_L2 + s2_fix_L3;
        const rataSilo2  = totalSilo2 / 3;

        const dataFisikBaru = {
            hari: document.getElementById("opHari").value || "-",
            tanggal: document.getElementById("opTgl").value || "-",
            silo1_opc: {
                mentah: { l1: s1_l1, l2: s1_l2, l3: s1_l3 },
                rata: parseFloat(rataSilo1.toFixed(2))
            },
            silo2_pcc: {
                mentah: { l1: s2_l1, l2: s2_l2, l3: s2_l3 },
                rata: parseFloat(rataSilo2.toFixed(2))
            },
            updateTime: new Date().toLocaleString("id-ID")
        };

        const REPO = "dashboard-produksi"; 
        const USER = "helmismd"; 
        const FILE_PATH = "data.json";
        const url = `https://github.com{USER}/${REPO}/contents/${FILE_PATH}`;

        try {
            const resGet = await fetch(url, { headers: { Authorization: `token ${token}` } });
            if (!resGet.ok) throw new Error("Gagal membaca database server. Token salah atau mati.");
            const fileData = await resGet.json();
            const shaLama = fileData.sha;
            const dataLamaJSON = JSON.parse(atob(fileData.content));

            // MERGE DATA: Sisipkan data fisik tanpa menyentuh/menghapus data kapal yang sedang aktif
            const dataFinalUpdate = {
                ...dataLamaJSON,
                fisikSilo: dataFisikBaru
            };

            const resPut = await fetch(url, {
                method: "PUT",
                headers: {
                    Authorization: `token ${token}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: `Update Fisik Silo oleh Operator - ${dataFisikBaru.tanggal}`,
                    content: btoa(unescape(encodeURIComponent(JSON.stringify(dataFinalUpdate, null, 2)))),
                    sha: shaLama
                })
            });

            if (resPut.ok) {
                alert(`ALHAMDULILLAH SUKSES!\n\nData fisik berhasil terkirim ke dashboard.\n\nRata OPC: ${rataSilo1.toFixed(2)} m\nRata PCC: ${rataSilo2.toFixed(2)} m`);
                document.getElementById("opS1_L1").value = ""; document.getElementById("opS1_L2").value = ""; document.getElementById("opS1_L3").value = "";
                document.getElementById("opS2_L1").value = ""; document.getElementById("opS2_L2").value = ""; document.getElementById("opS2_L3").value = "";
            } else {
                throw new Error("Gagal mengunggah pembaruan ke server.");
            }

        } catch (error) {
            console.error(error);
            alert(`PENGIRIMAN GAGAL!\n\nSebab: ${error.message}`);
        }
    }
</script>
</body>
</html>
