<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Form Pengukuran Silo - Operator</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 10px; }
        .container { max-width: 450px; margin: 0 auto; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border: 1px solid #ddd; width: 100%; }
        h2 { text-align: center; color: #007bff; margin-top: 0; font-size: 20px; border-bottom: 2px solid #007bff; padding-bottom: 8px; }
        .row { display: flex; gap: 8px; margin-bottom: 12px; width: 100%; }
        .group { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        label { font-weight: bold; margin-bottom: 4px; color: #333; font-size: 13px; text-align: center; }
        input { padding: 10px 4px; border: 2px solid #ccc; border-radius: 8px; font-size: 15px; outline: none; transition: 0.3s; text-align: center; background-color: #fff; width: 100%; display: block; }
        input:focus { border-color: #007bff; box-shadow: 0 0 5px rgba(0,123,255,0.2); }
        .section-title { background: #e9ecef; padding: 8px; font-weight: bold; text-align: center; border-radius: 6px; margin: 20px 0 10px 0; color: #495057; font-size: 14px; letter-spacing: 0.5px; }
        
        /* 🟡 KOTAK KUNING ESTETIS 2 BARIS INFO */
        .box-pratinjau { background-color: #fff9db; border: 1px dashed #fcc419; padding: 12px; border-radius: 8px; text-align: center; font-weight: bold; margin-top: 15px; }
        .title-pratinjau { font-size: 13px; color: #f59f00; letter-spacing: 0.5px; margin-bottom: 8px; border-bottom: 1px solid #ffe3e3; padding-bottom: 4px; }
        .col-rata { display: flex; justify-content: space-around; font-size: 14px; color: #495057; }
        .angka-merah { color: #e03131; font-size: 16px; display: block; margin-top: 4px; }

        .btn-hitung { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,123,255,0.2); }
        .btn-kirim { width: 100%; padding: 14px; background: #28a745; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; box-shadow: 0 4px 6px rgba(40,167,69,0.3); }
        button:active { transform: scale(0.98); }
    </style>
</head>
<body>

<div class="container">
    <h2 onclick="mintaTokenManual()" style="cursor: pointer; user-select: none;" title="Ketuk untuk ganti token">INPUT UKUR SILO</h2>
    
    <div class="row">
        <div class="group">
            <label>Hari</label>
            <input type="text" id="opHari" value="Sabtu" style="background-color: #f1f3f5; color: #495057; font-weight: bold;">
        </div>
        <div class="group">
            <label>Tanggal</label>
            <input type="text" id="opTgl" value="01-Agt-26" style="background-color: #f1f3f5; color: #495057; font-weight: bold;">
        </div>
    </div>

    <!-- BLOK SILO 1 -->
    <div class="section-title">SILO 1 (OPC) - METER MURNI</div>
    <div class="row">
        <div class="group"><label>Lubang 1</label><input type="number" step="0.01" id="opS1_L1" placeholder="0.00"></div>
        <div class="group"><label>Lubang 2</label><input type="number" step="0.01" id="opS1_L2" placeholder="0.00"></div>
        <div class="group"><label>Lubang 3</label><input type="number" step="0.01" id="opS1_L3" placeholder="0.00"></div>
    </div>

    <!-- BLOK SILO 2 -->
    <div class="section-title">SILO 2 (PCC) - METER MURNI</div>
    <div class="row">
        <div class="group"><label>Lubang 1</label><input type="number" step="0.01" id="opS2_L1" placeholder="0.00"></div>
        <div class="group"><label>Lubang 2</label><input type="number" step="0.01" id="opS2_L2" placeholder="0.00"></div>
        <div class="group"><label>Lubang 3</label><input type="number" step="0.01" id="opS2_L3" placeholder="0.00"></div>
    </div>

    <button onclick="hitungRataRataLive()" class="btn-hitung">HITUNG REKAP EXCEL</button>

    <!-- 🟡 KOTAK KUNING ESTETIS 2 BARIS DATA UTUH -->
    <div class="box-pratinjau">
        <div class="title-pratinjau">PRATINJAU HASIL PERHITUNGAN EXCEL</div>
        
        <!-- BARIS 1: METER -->
        <div class="col-rata" style="margin-bottom: 12px; border-bottom: 1px dashed #ffe3e3; padding-bottom: 8px;">
            <div>
                Rata Silo 1 (OPC)
                <span id="liveRataSilo1" class="angka-merah">0.00 m</span>
            </div>
            <div>
                Rata Silo 2 (PCC)
                <span id="liveRataSilo2" class="angka-merah">0.00 m</span>
            </div>
        </div>

        <!-- BARIS 2: TONASE VOLUME -->
        <div class="col-rata">
            <div>
                Isi Silo 1 (OPC)
                <span id="liveTonaseSilo1" class="angka-merah" style="color: #2b8a3e;">0.000 Ton</span>
            </div>
            <div>
                Isi Silo 2 (PCC)
                <span id="liveTonaseSilo2" class="angka-merah" style="color: #2b8a3e;">0.000 Ton</span>
            </div>
        </div>
    </div>

    <button onclick="kirimDataSilo()" class="btn-kirim">KIRIM DATA SILO</button>
</div>

<!-- 🚀 PANGGIL FILE RUMUS EKSTERNAL SEBELUM DIHITUNG -->
<script src="opc.js"></script>

<script>
    window.onload = function() {
        const hariIndo = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
        const bulanIndo = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agt", "Sep", "Okt", "Nov", "Des"];
        const skrg = new Date();
        document.getElementById("opHari").value = hariIndo[skrg.getDay()];
        const tgl = String(skrg.getDate()).padStart(2, '0');
        const bln = bulanIndo[skrg.getMonth()];
        const thn = String(skrg.getFullYear()).substring(2); 
        document.getElementById("opTgl").value = `${tgl}-${bln}-${thn}`;
    };

    function mintaTokenManual() {
        const tokenLama = localStorage.getItem("github_token") || "";
        const inputToken = prompt("PENGATURAN TOKEN GITHUB\n\nSilakan masukkan Token GitHub Anda:", tokenLama);
        if (inputToken !== null) {
            if (inputToken.trim() === "") {
                localStorage.removeItem("github_token");
                alert("Token berhasil dihapus dari memori!");
            } else {
                localStorage.setItem("github_token", inputToken.trim());
                alert("Token berhasil disimpan!");
            }
        }
    }

    // FUNGSI LOGIKA PEMBAGI 2 BARIS INFO KOTAK KUNING
    function hitungRataRataLive() {
        const s1_l1 = parseFloat(document.getElementById("opS1_L1").value) || 0;
        const s1_l2 = parseFloat(document.getElementById("opS1_L2").value) || 0;
        const s1_l3 = parseFloat(document.getElementById("opS1_L3").value) || 0;

        const s2_l1 = parseFloat(document.getElementById("opS2_L1").value) || 0;
        const s2_l2 = parseFloat(document.getElementById("opS2_L2").value) || 0;
        const s2_l3 = parseFloat(document.getElementById("opS2_L3").value) || 0;

        const s1_fix_L1 = s1_l1 > 0 ? (s1_l1 - 1) : 0;
        const s1_fix_L2 = s1_l2 > 0 ? (s1_l2 - 0.8) : 0;
        const s1_fix_L3 = s1_l3 > 0 ? (s1_l3 - 0.8) : 0;
        const rataSilo1 = (s1_fix_L1 + s1_fix_L2 + s1_fix_L3) / 3;

        // Ambil data konversi volume Tonase dari file opc.js
        let hasilOPC = { tonase: 0 };
        if (typeof hitungVolumeSilo1 === "function") {
            hasilOPC = hitungVolumeSilo1(rataSilo1);
        }

        // Tembakkan ke BARIS 1 (Meter)
        document.getElementById("liveRataSilo1").textContent = rataSilo1.toFixed(2) + " m";
        document.getElementById("liveRataSilo2").textContent = "0.00 m";

        // Tembakkan ke BARIS 2 (Tonase Volume)
        document.getElementById("liveTonaseSilo1").textContent = hasilOPC.tonase.toFixed(3) + " Ton";
        document.getElementById("liveTonaseSilo2").textContent = "0.000 Ton";

        return { rataSilo1, s1_l1, s1_l2, s1_l3, s2_l1, s2_l2, s2_l3, hasilOPC };
    }

    async function kirimDataSilo() {
        let token = localStorage.getItem("github_token"); 
        if (!token || token.trim() === "") {
            token = prompt("Silakan masukkan Token GitHub Terlebih Dahulu:");
            if (!token || token.trim() === "") return;
            localStorage.setItem("github_token", token.trim());
        }

        const kalkulasi = hitungRataRataLive();

        if (kalkulasi.s1_l1 === 0 && kalkulasi.s2_l1 === 0) {
            alert("Mohon isi angka pengukuran lubang silo terlebih dahulu!");
            return;
        }

        const dataFisikBaru = {
            hari: document.getElementById("opHari").value || "-",
            tanggal: document.getElementById("opTgl").value || "-",
            silo1_opc: { 
                mentah: { l1: kalkulasi.s1_l1, l2: kalkulasi.s1_l2, l3: kalkulasi.s1_l3 }, 
                rata: parseFloat(kalkulasi.rataSilo1.toFixed(2)),
                tonase: parseFloat(kalkulasi.hasilOPC.tonase.toFixed(3))
            },
            silo2_pcc: { mentah: { l1: kalkulasi.s2_l1, l2: kalkulasi.s2_l2, l3: kalkulasi.s2_l3 }, rata: 0, tonase: 0 },
            updateTime: new Date().toLocaleString("id-ID")
        };

        const REPO = "dashboard-produksi"; 
        const USER = "helmismd"; 
        const FILE_PATH = "data.json";
        const url = `https://github.com{USER}/${REPO}/contents/${FILE_PATH}`;

        try {
            const resGet = await fetch(url, { headers: { "Authorization": `Bearer ${token}`, "Accept": "application/vnd.github+json" } });
            if (resGet.status === 401 || resGet.status === 403) {
                localStorage.removeItem("github_token");
