<svg xmlns="http://w3.org" viewBox="0 0 1000 400" width="100%" height="100%">
  <!-- Latar Belakang Langit -->
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a90e2" />
      <stop offset="100%" stop-color="#bce3ff" />
    </linearGradient>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0066b2" />
      <stop offset="100%" stop-color="#003366" />
    </linearGradient>
  </defs>
  
  <rect width="1000" height="280" fill="url(#skyGrad)" />
  
  <!-- Burung Camar -->
  <path d="M350,120 Q355,115 360,122 Q365,115 370,120" fill="none" stroke="#ffffff" stroke-width="2" />
  <path d="M780,100 Q785,95 790,102 Q795,95 800,100" fill="none" stroke="#ffffff" stroke-width="2" />

  <!-- Struktur Atas Kapal (Deckhouse & Cargo) -->
  <!-- Kompartemen Tengah -->
  <rect x="360" y="170" width="60" height="25" fill="#f5f5f5" />
  <rect x="540" y="170" width="50" height="25" fill="#f5f5f5" />
  <rect x="420" y="175" width="120" height="15" fill="#2d6a4f" /> <!-- Pipa Hijau -->

  <!-- Anjungan Utama / Kapten (Kanan) -->
  <rect x="590" y="150" width="120" height="45" fill="#ffffff" />
  <rect x="600" y="125" width="100" height="25" fill="#ffffff" />
  <rect x="610" y="105" width="80" height="20" fill="#ffffff" />
  <rect x="625" y="85" width="50" height="20" fill="#d90429" /> <!-- Top Deck Merah -->
  
  <!-- Jendela Anjungan -->
  <rect x="605" y="130" width="10" height="10" fill="#333" />
  <rect x="620" y="130" width="10" height="10" fill="#333" />
  <rect x="635" y="130" width="10" height="10" fill="#333" />
  <rect x="650" y="130" width="10" height="10" fill="#333" />
  <rect x="665" y="130" width="10" height="10" fill="#333" />
  
  <!-- Tiang Depan -->
  <line x1="260" y1="195" x2="260" y2="120" stroke="#ffffff" stroke-width="5" />
  <circle cx="260" cy="115" r="5" fill="#ffffff" />

  <!-- Lambung Kapal Utama -->
  <!-- Bagian Biru -->
  <!-- Lambung Kapal -->
<path
    d="M170 195
       L735 195
       Q755 198 760 215
       L745 245
       Q742 255 720 258
       L250 258
       Q220 257 205 248
       L175 220
       Q165 210 170 195 Z"
    fill="#0F4C81"/>

<!-- Garis Merah -->
<path
    d="M205 242
       L742 242
       L730 258
       L245 258
       Q220 257 205 242 Z"
    fill="#C92A2A"/>

  <!-- Teks Lambung -->
  <text x="220" y="220" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">TL-XVIII</text>
  <text x="490" y="225" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">SEMEN TONASA</text>

  <!-- Laut / Gelombang -->
  <rect y="260" width="1000" height="140" fill="url(#seaGrad)" />
  <path d="M 0,260 Q 250,250 500,260 T 1000,260 L 1000,400 L 0,400 Z" fill="#005b96" opacity="0.5" />
  <path d="M 0,275 Q 300,265 600,275 T 1000,275 L 1000,400 L 0,400 Z" fill="#004b87" opacity="0.8" />
  
  <!-- Buih Putih di Dekat Kapal -->
  <ellipse cx="205" cy="255" rx="25" ry="8" fill="#ffffff" opacity="0.7" />
  <ellipse cx="730" cy="255" rx="35" ry="6" fill="#ffffff" opacity="0.6" />
</svg>
