<!DOCTYPE html>
<html lang="id">
<div class="menu-dashboard">
    <a href="index.html" class="btn-menu">🛢️ Monitoring Produksi</a>
</div>


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPMS - Silo Performance Monitoring System</title>
    <link rel="stylesheet" href="silo.css">
</head>

<body>
<div class="container">

    <h1>PACKING PLANT SAMARINDA</h1>

    <h2>SILO PERFORMANCE MONITORING SYSTEM</h2>
<div id="periode" class="periode"></div>

    <div id="lastUpdate">Loading...</div>

<!-- =========================
     PANEL KAPAL
========================= -->

<!-- =========================
     BANNER SPMS
========================= -->

<div class="banner">

    <!-- LANGIT -->
    <div class="sky"></div>

    <!-- AWAN -->
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>

    <!-- BURUNG -->
    <div class="bird bird1">🕊️</div>
    <div class="bird bird2">🕊️</div>

    <!-- KAPAL -->
    <img src="kapal-tonasa.png"
         class="kapal"
         alt="TL-XVIII">

    <!-- ASAP -->
    <div class="smoke">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- OMBAK BELAKANG -->
    <div class="wave waveBack"></div>

    <!-- OMBAK DEPAN -->
    <div class="wave waveFront"></div>

</div>

    <table class="shipTable">
        <tr>
            <td>Nama Kapal</td>
            <td id="shipName">-</td>
        </tr>

        <tr>
            <td>Voyage</td>
            <td id="shipProduct">-</td>
        </tr>

        <tr>
            <td>Cargo OPC</td>
            <td id="shipCargo">0 Ton</td>
        </tr>

        <tr>
            <td>Cargo PCC</td>
            <td id="shipUnload">0 Ton</td>
        </tr>

        <tr>
            <td>Total Cargo</td>
            <td id="shipRemain">0 Ton</td>
        </tr>

        <tr>
            <td>Status Kapal</td>
            <td id="shipSilo">-</td>
        </tr>

        <tr>
            <td>Status</td>
            <td id="shipStatus">-</td>
        </tr>

    </table>

</div>

    <div class="siloContainer">

        <!-- OPC -->
        <div class="siloCard">

            <div class="silo">
                <div class="level" id="levelOPC"></div>
            </div>

            <div class="siloName">SILO OPC</div>

            <div class="stock" id="stockOPC">0 Ton</div>

            <div class="percent" id="percentOPC">0%</div>

            <div class="status" id="statusOPC">NORMAL</div>

        </div>

        <!-- PCC -->
        <div class="siloCard">

            <div class="silo">
                <div class="level" id="levelPCC"></div>
            </div>

            <div class="siloName">SILO PCC</div>

            <div class="stock" id="stockPCC">0 Ton</div>

            <div class="percent" id="percentPCC">0%</div>

            <div class="status" id="statusPCC">NORMAL</div>

        </div>

    </div>

</div>


<script src="silo.js"></script>

</body>
</html>
